<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FIFA07">
<meta name="theme-color" content="#0a0a0a">
<title>FIFA07 · Pachangas Jerez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--s1:#141414;--s2:#1d1d1d;--line:#2a2a2a;--line2:#3a3a3a;
  --txt:#fafafa;--mut:#8f8f8f;--red:#e30613;--red2:#ff2b3b;--redbg:rgba(227,6,19,.12);
  --yel:#ffd400;--r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--txt);font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.4}
body{min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 50% at 50% -12%,rgba(227,6,19,.22) 0%,transparent 60%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;font-size:16px;-webkit-appearance:none;appearance:none;color:var(--txt);background:var(--s1);border:1px solid var(--line2);border-radius:12px;padding:12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:0;border-color:transparent}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto;width:20px;height:20px;accent-color:var(--red)}
input[type=date],input[type=time]{min-height:46px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 6px;font-weight:700}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* header & nav */
header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;max-width:720px;margin:0 auto}
.logo{font-family:'Anton';font-size:28px;line-height:1;letter-spacing:.01em}
.logo b{color:var(--red);font-weight:400}
.logo small{display:block;font-family:'Archivo';font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:4px}
.me{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);padding:5px 14px 5px 5px;border-radius:999px;font-weight:700;font-size:14px;max-width:58%}
.av{width:30px;height:30px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:17px;flex:none}
.ph{width:1.5em;height:1.5em;border-radius:50%;object-fit:cover;vertical-align:middle;display:inline-block}
.av .ph,.faces .f .ph{width:100%;height:100%;font-size:inherit}
.av,.faces .f{overflow:hidden}
.fut .face.hasph{top:22px;right:12px;width:56%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.fut .face .ph{width:100%;height:100%;border-radius:0}
.fut.white .face.hasph{box-shadow:0 0 0 3px rgba(0,0,0,.15)}
.photo-edit{display:flex;gap:16px;align-items:center;margin-top:8px}
.photo-edit .big{width:96px;height:96px;border-radius:50%;background:var(--s1);border:2px dashed var(--line2);display:grid;place-items:center;font-size:44px;overflow:hidden;flex:none}
.photo-edit .big img{width:100%;height:100%;object-fit:cover}
.lvpick{display:flex;gap:4px;margin-top:4px}
.lvpick button{font-size:38px;line-height:1;color:#3a3a3a}
.lvpick button.on{color:var(--red2)}
.lvlabel{font-weight:800;margin-top:4px}
.up{color:#4ade80;font-weight:700}.down{color:var(--red2);font-weight:700}
.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(10,10,10,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:720px;margin:0 auto}
nav.tabs button{flex:1;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--txt)}
nav.tabs button.on svg{stroke:var(--red)}

/* type */
h2{font-family:'Anton';font-weight:400;font-size:26px;letter-spacing:.01em;margin:28px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;text-transform:uppercase}
h2 .sub{font-family:'Archivo';font-size:13px;color:var(--mut);letter-spacing:0;text-transform:none;font-weight:500}
h3{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:22px 0 10px}
.muted{color:var(--mut)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.wrapr{flex-wrap:wrap}
.sp{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:999px;font-weight:800;font-size:14px;background:var(--s2);border:1px solid var(--line2);white-space:nowrap;letter-spacing:.01em}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:active{background:#b80510}
.btn.wht{background:#fff;color:#0a0a0a;border-color:#fff}
.btn.ghost{background:transparent}
.btn.dan{background:transparent;border-color:#5a1a1d;color:#ff8a92}
.btn.sm{padding:8px 13px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line2);font-size:17px;flex:none}

/* blocks */
.box{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.empty{text-align:center;padding:34px 16px;color:var(--mut);border:1px dashed var(--line2);border-radius:var(--r)}
.empty .big{font-size:38px;margin-bottom:8px}
.banner{display:flex;gap:12px;align-items:center;margin:14px 0 0;padding:14px;border-radius:var(--r);background:var(--redbg);border:1px solid rgba(227,6,19,.4);font-size:14px}
.banner.wht{background:#fff;color:#0a0a0a;border-color:#fff}
.banner .e{font-size:24px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--s2);color:var(--mut)}
.pill.red{background:var(--red);color:#fff}
.pill.wht{background:#fff;color:#0a0a0a}
.pill.out{background:transparent;border:1px solid var(--line2)}

/* match list card */
.mc{display:block;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.mc.next{border-color:rgba(227,6,19,.55);background:linear-gradient(160deg,rgba(227,6,19,.16),var(--s1) 55%)}
.mc .top{display:flex;gap:14px;align-items:center}
.date{flex:none;width:56px;text-align:center;border-radius:14px;padding:7px 0;background:#fff;color:#0a0a0a}
.date .m{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.date .d{font-family:'Anton';font-size:28px;line-height:1}
.date .w{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#555}
.mc .t1{font-weight:800;font-size:18px;line-height:1.15}
.mc .t2{color:var(--mut);font-size:13px;margin-top:3px}
.faces{display:flex;align-items:center;margin-top:14px}
.faces .f{width:30px;height:30px;border-radius:50%;background:var(--s2);border:2px solid var(--s1);display:grid;place-items:center;font-size:15px;margin-left:-8px}
.faces .f:first-child{margin-left:0}
.faces .f.me{border-color:var(--red)}
.faces .more{font-size:12px;font-weight:700;color:var(--mut);margin-left:8px}
.count{margin-left:auto;font-family:'Anton';font-size:22px;line-height:1}
.count small{font-family:'Archivo';font-size:13px;color:var(--mut);font-weight:600}
.bar{height:6px;background:var(--s2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px}
.bar i.full{background:#fff}
.mc .cta{margin-top:14px;display:flex;gap:8px}
.mc .cta .btn{flex:1}
.scoreline{display:flex;align-items:center;gap:10px;margin-top:14px}
.tw,.tb{flex:1;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tb{justify-content:flex-end}
.sq{width:14px;height:14px;border-radius:4px;flex:none}
.sq.w{background:#fff}.sq.b{background:#000;border:1.5px solid #fff}
.scoreline .n{font-family:'Anton';font-size:34px;line-height:1;min-width:30px;text-align:center}
.scoreline .dash{color:var(--mut);font-family:'Anton';font-size:20px}

/* detail */
.dhead{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.fact{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.fact b{display:block;font-family:'Anton';font-size:20px;font-weight:400}
.fact span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.plist{counter-reset:p}
.pl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.pl .num{width:22px;font-family:'Barlow Condensed';font-weight:700;color:var(--mut);font-size:16px;text-align:right}
.pl .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .lv{font-family:'Barlow Condensed';font-weight:700;color:var(--mut)}
.pl.me .nm{color:var(--red2)}
.pl.res{opacity:.55}
.pl.empty-slot .nm{color:#444;font-weight:500}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{border-radius:16px;padding:12px}
.team.w{background:#fff;color:#0a0a0a}
.team.b{background:#000;border:1.5px solid #fff}
.team .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.team .h b{font-family:'Anton';font-weight:400;font-size:20px;text-transform:uppercase}
.team .h span{font-family:'Barlow Condensed';font-weight:700;font-size:14px;opacity:.6}
.team .p{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:14px;font-weight:600;width:100%;text-align:left;color:inherit}
.team .p .o{margin-left:auto;font-family:'Barlow Condensed';font-weight:700;opacity:.55}
.team .p .g{font-size:11px}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aw{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.aw .ae{font-size:20px}
.aw .an{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:2px}
.aw b{display:block;font-size:14px;margin-top:2px}
.aw.neg{border-color:#3a3a3a;background:repeating-linear-gradient(135deg,var(--s1) 0 8px,#181818 8px 16px)}

/* FUT cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.fut{position:relative;aspect-ratio:3/4.25;border-radius:14px;padding:12px;overflow:hidden;width:100%;text-align:left;
  clip-path:polygon(50% 0,100% 5%,100% 93%,50% 100%,0 93%,0 5%);color:#fff;
  background:linear-gradient(160deg,#ff3b47 0%,var(--red) 40%,#6d0007 100%)}
.fut.white{background:linear-gradient(160deg,#ffffff 0%,#ececec 50%,#bdbdbd 100%);color:#0a0a0a}
.fut.black{background:linear-gradient(160deg,#3a3a3a 0%,#161616 45%,#000 100%);color:#fff}
.fut.black .nm{border-color:var(--red)}
.fut.vaya{background:repeating-linear-gradient(135deg,#5c5c5c 0 10px,#4a4a4a 10px 20px);color:#fff}
.fut::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.14) 45%,transparent 60%);pointer-events:none}
.fut .ovr{font-family:'Anton';font-size:34px;line-height:.9;position:absolute;top:22px;left:16px}
.fut .pos{font-family:'Barlow Condensed';font-weight:700;font-size:15px;position:absolute;top:58px;left:17px;letter-spacing:.05em}
.fut .lvl{position:absolute;top:78px;left:15px;font-family:'Barlow Condensed';font-weight:700;font-size:13px}
.fut .face{position:absolute;top:20px;right:12px;width:58%;aspect-ratio:1;display:grid;place-items:center;font-size:58px}
.fut .nm{position:absolute;left:14px;right:14px;top:57%;text-align:center;font-family:'Anton';font-size:19px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1.5px solid currentColor;padding-bottom:3px}
.fut .st{position:absolute;left:16px;right:16px;top:71%;display:grid;grid-template-columns:1fr 1fr;column-gap:10px;font-family:'Barlow Condensed';font-size:14px;font-weight:600}
.fut .st div{display:flex;gap:5px}
.fut .st b{font-weight:700;min-width:20px;text-align:right}
.fut .badge{position:absolute;top:7px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;opacity:.85}
.fut.big{max-width:230px;margin:0 auto;display:block}
.fut.big .ovr{font-size:48px;top:28px;left:22px}
.fut.big .pos{top:78px;left:24px;font-size:18px}
.fut.big .lvl{top:102px;left:22px;font-size:16px}
.fut.big .face{font-size:84px}
.fut.big .nm{font-size:26px}
.fut.big .st{font-size:18px;left:22px;right:22px}
.cardsY{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.cy,.cr{display:inline-block;width:8px;height:12px;border-radius:2px}
.cy{background:var(--yel)}.cr{background:var(--red)}

/* tables & boards */
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
th:nth-child(1),th:nth-child(2){text-align:left}
td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td:nth-child(1){text-align:left;width:26px;font-family:'Anton';color:var(--mut)}
td:nth-child(2){text-align:left;font-weight:700}
tr.mine td{background:var(--redbg)}
tbody tr:nth-child(1) td:nth-child(1){color:var(--red)}
td.pts{font-family:'Anton';font-size:18px}
.lb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbc{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.lbc .tt{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.lbc .l{display:flex;gap:6px;align-items:center;padding:3px 0;font-size:14px}
.lbc .l b{margin-left:auto;font-family:'Barlow Condensed';font-size:16px}
.lbc .l:first-of-type{font-weight:800}
.lbc .l:first-of-type b{color:var(--red2)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 4px}
.monthnav .t{font-family:'Anton';font-size:24px;text-transform:uppercase;text-align:center}
.pitch{position:relative;border-radius:18px;padding:12px 4px;overflow:hidden;background:#0d0d0d;border:1.5px solid #fff}
.pitch::before{content:"";position:absolute;left:50%;top:50%;width:96px;height:96px;border:1.5px solid rgba(255,255,255,.35);border-radius:50%;transform:translate(-50%,-50%)}
.pitch::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px solid rgba(255,255,255,.35)}
.pitch .ln{position:relative;z-index:1;display:flex;justify-content:center;gap:6px;margin:8px 0}
.pitch.rombo{height:600px;padding:0}
.pitch.rombo::after{display:none}
.pitch.rombo::before{top:31%}
.pitch .area{position:absolute;left:50%;bottom:-2px;width:62%;height:24%;transform:translateX(-50%);border:1.5px solid rgba(255,255,255,.35);border-bottom:0;border-radius:90px 90px 0 0}
.pitch .spot{position:absolute;transform:translateX(-50%);z-index:1;margin-top:12px;display:flex;flex-direction:column;align-items:center}
.pitch .slab{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-top:2px;background:#0d0d0d;padding:1px 6px;border-radius:99px}
.pitch .fut{width:104px;flex:none;padding:8px}
.pitch .fut .ovr{font-size:22px;top:14px;left:10px}
.pitch .fut .pos{font-size:11px;top:38px;left:11px}
.pitch .fut .lvl{font-size:10px;top:52px;left:10px}
.pitch .fut .face{font-size:32px;top:12px;right:6px}
.pitch .fut .nm{font-size:12px;top:60%;left:6px;right:6px;padding:0 0 2px}
.pitch .fut .st{display:none}
.pitch .fut .badge{font-size:7px;top:5px}
.fut .mp{position:absolute;left:0;right:0;top:77%;text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:13px}
.potm{display:flex;gap:16px;align-items:center}
.potm .fut{width:118px;flex:none;padding:8px}
.potm .fut .ovr{font-size:26px;top:16px;left:12px}
.potm .fut .pos{font-size:12px;top:44px;left:13px}
.potm .fut .lvl{font-size:11px;top:60px;left:12px}
.potm .fut .face{font-size:38px;top:14px;right:8px}
.potm .fut .nm{font-size:14px;top:62%;left:8px;right:8px}
.potm .fut .st,.potm .fut .strk{display:none}
.potm .fut .badge{font-size:7px;top:5px}
.hero{display:flex;gap:14px;align-items:center;margin-top:14px;padding:14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);width:100%;text-align:left}
.hero .big{font-family:'Anton';font-size:40px;line-height:1;color:var(--red2)}
.hero .t{font-size:12px;color:var(--mut)}
.stars{color:var(--red2);letter-spacing:1px}
.beta{display:inline-block;vertical-align:top;margin:4px 0 0 6px;font-family:'Archivo';font-size:9px;font-weight:800;letter-spacing:.12em;background:var(--red);color:#fff;padding:2px 6px;border-radius:6px}
.credit{text-align:center;margin:36px 0 10px;padding:22px 16px;border-top:1px solid var(--line);font-size:14px}
.previa{margin-top:14px;border-radius:18px;padding:14px;background:linear-gradient(160deg,#1a0002,#0f0f0f 70%);border:1px solid rgba(227,6,19,.4)}
.pv-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red2)}
.pv-cd{color:var(--txt);letter-spacing:0;text-transform:none;font-size:13px}
.pv-odds{margin-top:12px}
.pv-bar{height:12px;border-radius:99px;background:#000;border:1.5px solid #fff;overflow:hidden}
.pv-bar i{display:block;height:100%;background:#fff}
.pv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pv-col{border-radius:14px;padding:10px}
.pv-col.w{background:#fff;color:#0a0a0a}.pv-col.b{background:#000;border:1.5px solid #fff}
.pv-t{font-family:'Anton';font-size:18px;text-transform:uppercase}
.pv-lv{font-family:'Barlow Condensed';font-weight:700;opacity:.6;margin-bottom:4px}
.pv-k{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin-top:8px}
.pv-p{font-weight:700;font-size:13px;margin-top:2px}
.pv-wx{margin-top:12px;font-size:13px;color:var(--txt)}
.poll{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.poll .t1{font-weight:800;font-size:17px}

  const avg={};for(const[p,a]of Object.entries(rat))avg[p]=a.reduce((x,y)=>x+y,0)/a.length;
  const win={};AWARDS.forEach(a=>win[a.k]=tally(cnt[a.k]));
  return{win,avg,nVotes:vs.length,rat};
}
function resultFor(m,pid){
  if(m.status!=='played')return null;
  const inA=(m.teamA||[]).includes(pid),inB=(m.teamB||[]).includes(pid);
  if(!inA&&!inB)return null;
  const a=+m.scoreA||0,b=+m.scoreB||0;if(a===b)return'E';
  return(inA?a>b:b>a)?'V':'D';
}
function computeLevels(){
  const L={};for(const id in S.players)L[id]={level:+S.players[id].level0||2,n:0,d:{},pre:{}};
  const played=Object.values(S.matches).filter(m=>m.status==='played'&&(m.teamA||[]).length&&(m.teamB||[]).length).sort((a,b)=>mdt(a)-mdt(b));
  for(const m of played){
    const A=m.teamA.filter(p=>L[p]),B=m.teamB.filter(p=>L[p]);if(!A.length||!B.length)continue;
    const avg=t=>t.reduce((s,p)=>s+L[p].level,0)/t.length;
    const la=avg(A),lb=avg(B);
    const eA=1/(1+Math.pow(10,(lb-la)/LV.SCALE));
    const ga=+m.scoreA||0,gb=+m.scoreB||0;const sA=ga>gb?1:ga<gb?0:.5;
    const mult=1+Math.min(Math.abs(ga-gb),4)*LV.MARGIN;
    const aw=matchAwards(m);
    const apply=(p,s,e)=>{const x=L[p];x.pre[m.id]=x.level;const k=x.n<LV.NEW_MATCHES?LV.K_NEW:LV.K;let d=k*mult*(s-e);
      if(aw.avg[p]!=null)d+=LV.STARS_PULL*(aw.avg[p]-x.level);
      const nl=Math.max(LV.MIN,Math.min(LV.MAX,x.level+d));x.d[m.id]=nl-x.level;x.level=nl;x.n++};
    A.forEach(p=>apply(p,sA,eA));B.forEach(p=>apply(p,1-sA,1-eA));
  }
  return L;
}
function computeStats(flt){
  const LVL=computeLevels();
  const st={};
  for(const id in S.players){const p=S.players[id];st[id]={pj:0,v:0,e:0,d:0,g:0,a:0,aw:{crack:0,dandy:0,duro:0,vaya:0},rs:[],pts:0,y:p.yellow||0,r:p.red||0,hist:[],lv0:+p.level0||2,kitN:0,hasKit:!!p.kit}}
  const played=Object.values(S.matches).filter(m=>m.status==='played'&&(!flt||flt(m))).sort((a,b)=>mdt(a)-mdt(b));
  for(const m of played){
    const aw=matchAwards(m);
    for(const pid of attendees(m)){
      const s=st[pid];if(!s)continue;
      let pts=PTS.play;s.pj++;
      const res=resultFor(m,pid);
      if(res==='V'){s.v++;pts+=PTS.win}else if(res==='E'){s.e++;pts+=PTS.draw}else if(res==='D')s.d++;
      const g=+(m.goals||{})[pid]||0,a=+(m.assists||{})[pid]||0;
      s.g+=g;s.a+=a;pts+=g*PTS.goal+a*PTS.assist;
      if((m.kit||{})[pid]){s.kitN++;if(kitOn())pts+=PTS.kit}
      const aws=[];AWARDS.forEach(A=>{if(aw.win[A.k].includes(pid)){s.aw[A.k]++;pts+=A.pts;aws.push(A.e)}});
      if(aw.rat[pid])s.rs.push(...aw.rat[pid]);
      if(aw.avg[pid]!=null)pts+=Math.round((aw.avg[pid]-3)*2);
      s.pts+=pts;s.hist.push({m,res,g,a,aws,avg:aw.avg[pid],pts,dl:LVL[pid]?.d[m.id]});
    }
  }
  for(const id in st){
    const s=st[id];if(!flt)s.pts+=s.y*PTS.yellow+s.r*PTS.red;
    s.avg=s.rs.length?s.rs.reduce((x,y)=>x+y,0)/s.rs.length:null;
    s.level=LVL[id]?.level??s.lv0;
    s.rel=Math.min(100,Math.round((LVL[id]?.n||0)/LV.FULL*100));
    const gpm=s.pj?s.g/s.pj:0,cr=s.pj?s.aw.crack/s.pj:0,wr=s.pj?s.v/s.pj:0,vr=s.pj?s.aw.vaya/s.pj:0;
    s.ovr=Math.max(40,Math.min(99,Math.round(40+s.level*11+Math.min(gpm,2)*1.5+cr*4+wr*2-vr*3)));
  }
  return enrich(st);
}
function attrs(s){
  const c=v=>Math.max(1,Math.min(99,Math.round(v)));
  return[['CRK',c(30+s.aw.crack*12)],['GOL',c(35+(s.pj?s.g/s.pj:0)*22)],['DAN',c(30+s.aw.dandy*12)],['VIC',s.pj?c(s.v/s.pj*100):'—'],['DUR',c(30+s.aw.duro*12)],['FIA',c(99-s.y*15-s.r*35)]];
}
const tier=o=>o>=80?'red':o>=70?'white':'black';
function balance(ids,st){
  const lv=p=>st[p]?.level||2;
  const pool=ids.slice().sort((a,b)=>lv(b)-lv(a)||String(a).localeCompare(String(b)));
  let A=[],B=[];
  pool.forEach((p,i)=>{const r=i%4;(r===0||r===3?A:B).push(p)});
  const sum=arr=>arr.reduce((t,p)=>t+lv(p),0);
  for(let it=0;it<60;it++){
    const d=sum(A)-sum(B);let best=null,bd=Math.abs(d);
    for(const a of A)for(const b of B){const nd=Math.abs(d-2*(lv(a)-lv(b)));if(nd<bd-1e-9){bd=nd;best=[a,b]}}
    if(!best)break;A=A.map(x=>x===best[0]?best[1]:x);B=B.map(x=>x===best[1]?best[0]:x);
  }
  const gks=pool.filter(p=>P(p)?.pos==='POR');
  if(gks.length>=2&&A.includes(gks[0])===A.includes(gks[1])){
    const g=gks[1],inA=A.includes(g),from=inA?A:B,to=inA?B:A;
    const alt=to.filter(x=>P(x)?.pos!=='POR').sort((x,y)=>Math.abs(lv(x)-lv(g))-Math.abs(lv(y)-lv(g)))[0];
    if(alt){from[from.indexOf(g)]=alt;to[to.indexOf(alt)]=g}
  }
  return{A,B,sa:sum(A),sb:sum(B)};
}
const stars=v=>{const f=Math.round(v);return `<span class="stars">${'★'.repeat(f)}<span style="color:#3a3a3a">${'★'.repeat(5-f)}</span></span>`};

      x+=`</div>`;
    });
    x+=`</div>`;
    if(!played){
      if(suggest)x+=`<p class="small muted" style="margin-top:8px">La app equilibra los equipos por nivel ⚡ y se ajusta sola según se apunta gente. Queda cerrado cuando se llena la lista.</p>`;
      else x+=`<p class="small muted" style="margin-top:8px">Hecho por la app según el nivel ⚡. Si hace falta, toca a un jugador para pasarlo al otro equipo.</p>`;
    }

  // Lista
  if(!played){
    x+=`<h3>Apuntados · ${cnt}/${n}</h3><div class="plist">`;

      x+=p?`<button class="pl ${p===me?'me':''}" data-act="profile" data-id="${esc(p)}"><span class="num">${i+1}</span><span class="av">${face(p)}</span><span class="nm">${esc(pname(p))}${m.promoted?.pid===p?' <span class="pill wht">⬆️ subió</span>':''}</span><span class="lv">⚡${(st[p]?.level||2).toFixed(1)}</span></button>`
         :`<div class="pl empty-slot"><span class="num">${i+1}</span><span class="av" style="opacity:.3">·</span><span class="nm">Libre</span></div>`}
    x+=`</div>`;
    if(L.res.length){x+=`<h3>🪑 Reserva</h3>`;L.res.forEach((p,i)=>x+=`<button class="pl res ${p===me?'me':''}" data-act="profile" data-id="${esc(p)}"><span class="num">R${i+1}</span><span class="av">${face(p)}</span><span class="nm">${esc(pname(p))}</span></button>`)}
  }

  // Pagos
  if(m.price){
    const paid=att.filter(p=>(m.paid||{})[p]).length;
    x+=`<h3>💶 Pagos</h3><button class="box row" style="width:100%;text-align:left" data-act="pay" data-id="${esc(m.id)}"><span class="sp"><b>${paid}/${att.length} han pagado</b><br><span class="small muted">${m.bizum?`Bizum a ${esc(m.bizum)}`:'Sin Bizum indicado'} · ${esc(m.price)}€ por cabeza</span></span><span class="muted">›</span></button>`;
  }

  // Acciones
  x+=`<h3>Más</h3><div class="row wrapr">`;
  if(!played)x+=`<button class="btn sm" data-act="copy" data-id="${esc(m.id)}">📋 Copiar lista</button><button class="btn sm" data-act="addOther" data-id="${esc(m.id)}">＋ Apuntar a otro</button>`;
  if(!played&&h<=2&&h>0)x+=`<button class="btn sm" data-act="result" data-id="${esc(m.id)}">📝 Resultado</button>`;
  if(played)x+=`<button class="btn sm" data-act="result" data-id="${esc(m.id)}">✏️ Editar resultado</button>`;
  if(!played&&h>0)x+=`<button class="btn sm" data-act="cal" data-id="${esc(m.id)}">📅 Calendario</button>`;
  if(!played)x+=`<button class="btn sm" data-act="editMatch" data-id="${esc(m.id)}">✏️ Editar</button>`;
  if(isAdmin()||m.createdBy===me)x+=`<button class="btn sm dan" data-act="delMatch" data-id="${esc(m.id)}">🗑 Borrar</button>`;
  x+=`</div>`;
  return x;
}

function seasonView(stAll){

function futCard(id,st,big=false,opt={}){
  const p=P(id),s=st[id];if(!p)return'';
  const vayaKing=!opt.noVaya&&s.aw.vaya>0&&s.aw.vaya===Math.max(...Object.values(st).map(x=>x.aw.vaya));
  const inf=!opt.noInform&&S._inf&&S._inf.has(id);
  const t=inf?'inform':vayaKing?'vaya':tier(s.ovr);const sk=streak(s);
  return `<button class="fut ${t} ${big?'big':''}" ${big?'':`data-act="profile" data-id="${esc(id)}"`}>
    ${sk&&!opt.extra?`<div class="strk">${sk.e}${sk.n}</div>`:''}
    ${opt.badge?`<div class="badge">${opt.badge}</div>`:inf?'<div class="badge">⭐ Crack de la jornada</div>':vayaKing?'<div class="badge">🤦 Rey del Vaya día</div>':s.aw.crack>=3?'<div class="badge">⭐ Leyenda</div>':''}
    <div class="ovr">${s.ovr}</div><div class="pos">${esc(p.pos||'TODO')}${kitOn()&&p.dorsal?` · ${+p.dorsal}`:''}</div><div class="lvl">⚡${s.level.toFixed(1)}</div>

    <div class="st">${attrs(s).map(([k,v])=>`<div><b>${v}</b>${k}</div>`).join('')}</div>${opt.extra||''}</button>`;
}

/* ============ MODALES ============ */
function modal(html,onMount,sheet=null){
  S.sheet=sheet;
  const r=$('#modalRoot');r.innerHTML=`<div class="ov"><div class="md"><div class="grab"></div>${html}</div></div>`;
  const ov=r.firstChild;ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('.x'))close()});
  onMount&&onMount(ov.querySelector('.md'));
}
function close(){S.sheet=null;$('#modalRoot').innerHTML=''}
const mh=t=>`<div class="mh"><h2>${t}</h2><button class="x">✕</button></div>`;
function confirmBox(title,text,okLabel,onOk,danger){
  modal(`${mh(title)}<p class="muted" style="margin:8px 0 20px">${text}</p><div class="row"><button class="btn full x" style="width:auto;flex:1;height:auto;font-size:14px;color:var(--txt);background:var(--s2)">Cancelar</button><button class="btn full ${danger?'dan':'pri'}" id="ok" style="flex:1">${okLabel}</button></div>`,
  md=>md.querySelector('#ok').onclick=async()=>{md.querySelector('#ok').disabled=true;try{await onOk()}catch(e){err(e)}if(!S.keepModal)close();S.keepModal=false});
}
function openMatch(id){modal(`<div class="mh"><span class="pill out">Partido</span><button class="x">✕</button></div><div id="sheetBody">${matchDetail(S.matches[id],computeStats())}</div>`,null,{type:'match',id})}

function pinPrompt(title,sub,cb){
  modal(`${mh(title)}<p class="muted">${sub}</p><div class="pin">${[0,1,2,3].map(i=>`<input inputmode="numeric" maxlength="1" pattern="[0-9]*" data-i="${i}">`).join('')}</div><p class="small muted" id="perr" style="text-align:center;min-height:18px"></p>`,
  md=>{
    const ins=[...md.querySelectorAll('.pin input')];setTimeout(()=>ins[0].focus(),50);
    const done=async()=>{const v=ins.map(i=>i.value).join('');if(v.length===4){const ok=await cb(v);if(ok===false){ins.forEach(i=>i.value='');ins[0].focus();md.querySelector('#perr').textContent='PIN incorrecto'}}};
    ins.forEach((inp,i)=>{
      inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,'').slice(-1);if(inp.value&&i<3)ins[i+1].focus();done()};
      inp.onkeydown=e=>{if(e.key==='Backspace'&&!inp.value&&i>0)ins[i-1].focus()};
    });
  });
}

  const ids=Object.keys(S.players).sort((a,b)=>pname(a).localeCompare(pname(b)));

async function join(mid,pid){
  if(!pid){toast('Primero dinos quién eres');pickMe();return}
  if(S.signups[`${mid}__${pid}`])return;
  const m=S.matches[mid];const full=lineup(m).in.length>=(m.slots||10);
  try{await store.doc(`signups/${mid}__${pid}`).set({mid,pid,at:Date.now()});autoTeams(mid);
    toast(pid===me?(full?'Estás en reserva 🪑':'¡Dentro! Ahora no falles 😤'):`${pname(pid)} apuntado`)}catch(e){err(e)}
}
function leave(mid){
  if(!me)return;
  const m=S.matches[mid];const h=hoursTo(m);const L=lineup(m);
  const starter=L.in.includes(me),late=h<24&&h>0&&starter;
  const up=starter&&L.res.length?L.res[0]:null;
  const p=P(me);const isRed=(p?.yellow||0)>=1;const card=isRed?'🟥 roja':'🟨 amarilla';
  confirmBox('¿Te bajas?',late?`Quedan menos de 24h. Según las normas te llevas <b>${card}</b>.`:`Te quitamos de la lista.${up?` Sube <b>${esc(pname(up))}</b> desde la reserva.`:''}`,late?`Sí, me la como`:'Desapuntarme',async()=>{
    await store.doc(`signups/${mid}__${me}`).delete();autoTeams(mid);
    if(up)await store.doc('matches/'+mid).update({promoted:{pid:up,at:Date.now(),by:me}});
    if(late){
      const log=[...(p.cardLog||[]),{type:isRed?'red':'yellow',mid,at:Date.now()}];
      await store.doc('players/'+me).update(isRed?{red:(p.red||0)+1,cardLog:log}:{yellow:(p.yellow||0)+1,cardLog:log});
    }
    if(up){S.keepModal=true;
      const txt=`⬆️ ${pname(me)} se baja del partido del ${fmtShort(m)} (${m.venue}). Entra ${pname(up)} desde la reserva. ¡${pname(up)}, cuentan contigo!`;
      modal(`${mh('Sube '+esc(pname(up)))}<p class="muted">${late?(isRed?'🟥 Roja apuntada. ':'🟨 Amarilla apuntada. '):''}Avisa a ${esc(pname(up))} para que sepa que entra.</p><textarea rows="4" readonly style="margin-top:12px">${esc(txt)}</textarea><button class="btn pri full" id="cp" style="margin-top:12px">📋 Copiar aviso para WhatsApp</button>`,
      md=>md.querySelector('#cp').onclick=()=>copyText(txt,'Aviso copiado. Pégalo en el grupo 📲',md.querySelector('textarea')));
    }else toast(late?(isRed?'🟥 ¡Roja! Vaya tela…':'🟨 Amarilla. Que no se repita.'):'Desapuntado');
  },true);
}
function addOther(mid){
  const inM=new Set(signupsOf(mid).map(s=>s.pid));
  const ids=Object.keys(S.players).filter(i=>!inM.has(i)).sort((a,b)=>pname(a).localeCompare(pname(b)));
  modal(`${mh('Apuntar a otro')}<p class="muted small" style="margin-bottom:10px">Para el que no tiene la app a mano. Lo apuntas tú, se compromete él.</p>

async function makeTeams(mid,shuffle){
  const m=S.matches[mid];const st=computeStats();const lv=p=>st[p]?.level||2;
  const T=balance(lineup(m).in,st);
  if(shuffle){
    const opts=[];for(const a of T.A)for(const b of T.B){const nd=Math.abs((T.sa-T.sb)-2*(lv(a)-lv(b)));if(nd<=Math.abs(T.sa-T.sb)+0.5)opts.push([a,b])}
    if(opts.length){const[a,b]=opts[Math.floor(Math.random()*opts.length)];T.A=T.A.map(x=>x===a?b:x);T.B=T.B.map(x=>x===b?a:x);T.sa+=lv(b)-lv(a);T.sb+=lv(a)-lv(b)}
  }
  try{await store.doc('matches/'+mid).update({teamA:T.A,teamB:T.B});toast(`Reparto hecho ⚖️ ⚡${(T.sa/(T.A.length||1)).toFixed(2)} vs ${(T.sb/(T.B.length||1)).toFixed(2)}`)}catch(e){err(e)}
}
// Reparto automático: con la lista completa queda fijado; si se libera una plaza, vuelve a ser provisional.
async function autoTeams(mid){
  await new Promise(r=>setTimeout(r,80));
  const m=S.matches[mid];if(!m||m.status==='played')return;
  const L=lineup(m),n=m.slots||10,saved=(m.teamA||[]).length>0;
  try{
    if(L.in.length>=n){
      const T=balance(L.in,computeStats());
      const same=saved&&[...m.teamA].sort().join()===[...T.A].sort().join()&&[...m.teamB].sort().join()===[...T.B].sort().join();
      if(!same)await store.doc('matches/'+mid).update({teamA:T.A,teamB:T.B});
    }else if(saved)await store.doc('matches/'+mid).update({teamA:[],teamB:[]});
  }catch(e){console.error(e)}
}
async function swap(mid,pid){
  const m=S.matches[mid];let A=[...(m.teamA||[])],B=[...(m.teamB||[])];
  if(A.includes(pid)){A=A.filter(x=>x!==pid);B.push(pid)}else{B=B.filter(x=>x!==pid);A.push(pid)}
  try{await store.doc('matches/'+mid).update({teamA:A,teamB:B})}catch(e){err(e)}
}

function resultForm(mid){
  const m=S.matches[mid];
  let A=[...(m.teamA||[])],B=[...(m.teamB||[])];
  if(!A.length&&!B.length){const T=balance(lineup(m).in,computeStats());A=T.A;B=T.B}
  const goals={...(m.goals||{})},ast={...(m.assists||{})},kit={...(m.kit||{})};
  const team={};A.forEach(p=>team[p]='A');B.forEach(p=>team[p]='B');
  const sync=()=>{A=Object.keys(team).filter(x=>team[x]==='A');B=Object.keys(team).filter(x=>team[x]==='B')};
  const draw=md=>{
    const ga=A.reduce((t,p)=>t+(goals[p]||0),0),gb=B.reduce((t,p)=>t+(goals[p]||0),0);
    md.querySelector('#rows').innerHTML=[...A,...B].map(p=>`<div class="prow">
      <button class="tog ${team[p]==='A'?'on':''}" data-tg="${esc(p)}" style="min-width:64px">${team[p]==='A'?'Blanco':'Negro'}</button>
      ${kitOn()?`<button class="kitt ${kit[p]?'on':''}" data-k="${esc(p)}" title="Vino con la camiseta">👕</button>`:''}
      <span class="nm">${esc(pname(p))}</span>
      <div><div class="lbl">Goles</div><div class="stepper"><button data-g="${esc(p)}" data-d="-1">−</button><span>${goals[p]||0}</span><button data-g="${esc(p)}" data-d="1">+</button></div></div>
      <div><div class="lbl">Asist</div><div class="stepper"><button data-a="${esc(p)}" data-d="-1">−</button><span>${ast[p]||0}</span><button data-a="${esc(p)}" data-d="1">+</button></div></div></div>`).join('');
    md.querySelector('#hint').textContent=`Goles apuntados: Blancos ${ga} – ${gb} Negros`;
    md.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const p=b.dataset.g;goals[p]=Math.max(0,(goals[p]||0)+ +b.dataset.d);draw(md)});
    md.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const p=b.dataset.a;ast[p]=Math.max(0,(ast[p]||0)+ +b.dataset.d);draw(md)});
    md.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const p=b.dataset.tg;team[p]=team[p]==='A'?'B':'A';sync();draw(md)});
    md.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const p=b.dataset.k;kit[p]=!kit[p];draw(md)});
  };
  const sIn=v=>`style="width:72px;text-align:center;font-family:Anton;font-size:30px;padding:8px" type="number" min="0" inputmode="numeric" value="${v}"`;
  modal(`${mh('Resultado')}
    <div class="box"><div class="scoreline" style="margin:0"><div class="tw"><i class="sq w"></i>Blancos</div><input id="sa" ${sIn(+m.scoreA||0)}><div class="dash">–</div><input id="sb" ${sIn(+m.scoreB||0)}><div class="tb">Negros<i class="sq b"></i></div></div></div>
    <p class="muted small" id="hint" style="margin:10px 0 2px"></p>${kitOn()?`<p class="muted small">👕 = vino con la camiseta oficial (+${PTS.kit} pt)</p>`:''}
    <div id="rows"></div>
    <button class="btn full ghost" id="addp" style="margin-top:12px">＋ Vino alguien que no estaba apuntado</button>
    <button class="btn pri full" id="sv" style="margin-top:10px">Guardar resultado</button>`,
  md=>{
    draw(md);
    md.querySelector('#addp').onclick=()=>{
      const used=new Set([...A,...B]);const opts=Object.keys(S.players).filter(p=>!used.has(p)).sort((a,b)=>pname(a).localeCompare(pname(b)));
      if(!opts.length){toast('No quedan jugadores');return}
      const sel=document.createElement('select');sel.innerHTML='<option value="">Elige jugador…</option>'+opts.map(p=>`<option value="${esc(p)}">${esc(pname(p))}</option>`).join('');sel.style.marginTop='8px';
      sel.onchange=()=>{if(!sel.value)return;team[sel.value]=A.length<=B.length?'A':'B';sync();sel.remove();draw(md)};
      md.querySelector('#addp').after(sel);
    };
    md.querySelector('#sv').onclick=async e=>{
      e.target.disabled=true;
      const g={},a={},k={};[...A,...B].forEach(p=>{g[p]=goals[p]||0;a[p]=ast[p]||0;if(kit[p])k[p]=true});
      try{
        await store.doc('matches/'+mid).update({teamA:A,teamB:B,scoreA:Math.max(0,+md.querySelector('#sa').value||0),scoreB:Math.max(0,+md.querySelector('#sb').value||0),goals:g,assists:a,kit:k,status:'played',playedAt:m.playedAt||Date.now()});
        close();toast('Resultado guardado. ¡A votar! ⭐');
        if(me&&[...A,...B].includes(me)&&!hasVoted(mid,me))setTimeout(()=>voteForm(mid),450);
      }catch(x){e.target.disabled=false;err(x)}
    };
  });
}

function voteForm(mid){
  const m=S.matches[mid];if(!me){pickMe();return}
  if(hasVoted(mid,me)){toast('Ya has votado este partido ✅');return}
  if(!attendees(m).includes(me)){toast('Solo votan los que jugaron');return}
  const others=attendees(m).filter(p=>p!==me&&P(p));
  const r={},aw={};
  const SL={1:'Tronco',2:'Flojito',3:'Cumplió',4:'Muy bien',5:'Crack'};
  modal(`${mh('Puntúa el partido')}<p class="muted small">${esc(fmtShort(m))} · ${esc(m.venue||'')}<br>🔒 <b>Voto anónimo:</b> nadie, ni los admins, puede ver qué has votado. Solo se puede votar una vez.</p>
    <h3>Nivel de hoy</h3>
    ${others.map(p=>`<div class="prow"><span class="av">${face(p)}</span><span class="nm">${esc(pname(p))}</span><div class="starpick" data-p="${esc(p)}">${[1,2,3,4,5].map(i=>`<button data-s="${i}">★</button>`).join('')}</div><span class="sl"></span></div>`).join('')}
    ${AWARDS.map(A=>`<h3>${A.e} ${A.n} <span style="text-transform:none;letter-spacing:0;font-weight:500">· ${A.d}</span></h3><div class="opts" data-aw="${A.k}">${(A.self?[me,...others]:others).map(p=>`<button class="opt" data-v="${esc(p)}">${p===me?'Yo mismo 🙋':esc(pname(p))}</button>`).join('')}</div>`).join('')}
    <button class="btn pri full" id="sv" style="margin-top:22px">Enviar votos</button>`,
  md=>{
    md.querySelectorAll('.starpick').forEach(sp=>sp.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const p=sp.dataset.p,v=+b.dataset.s;r[p]=v;sp.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.s<=v));sp.nextElementSibling.textContent=SL[v]}));
    md.querySelectorAll('[data-aw]').forEach(g=>{const k=g.dataset.aw,neg=AWARDS.find(a=>a.k===k).pts<0;
      g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{aw[k]=aw[k]===b.dataset.v?null:b.dataset.v;g.querySelectorAll('.opt').forEach(x=>{x.classList.remove('on','onw');if(x.dataset.v===aw[k])x.classList.add(neg?'onw':'on')})})});
    md.querySelector('#sv').onclick=async e=>{
      const miss=others.filter(p=>!r[p]);
      if(miss.length){toast(`Faltan estrellas para ${miss.map(pname).join(', ')}`);return}
      if(!aw.crack){toast('Elige a El Crack');return}
      if(hasVoted(mid,me)){toast('Ya has votado este partido ✅');close();return}
      e.target.disabled=true;
      const awards={};AWARDS.forEach(A=>{if(aw[A.k])awards[A.k]=aw[A.k]});
      try{
        // El voto se guarda SIN identificar a quien vota; aparte solo se marca que ya ha votado.
        await store.doc('votes/'+nid()+Math.random().toString(36).slice(2,8)).set({mid,ratings:r,awards});
        await store.doc(`voted/${mid}__${me}`).set({mid,pid:me});
        close();toast('Votos enviados 🗳️');
      }catch(x){e.target.disabled=false;err(x)}
    };
  });
}

// Recorta al centro y reduce la foto a un cuadrado pequeño (≈15 KB) para guardarla con el jugador.
function shrinkImage(file,size){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const s=Math.min(img.naturalWidth,img.naturalHeight);const c=document.createElement('canvas');c.width=c.height=size;
      const g=c.getContext('2d');g.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,size,size);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url;
  });
}
function copyText(t,msg,fallbackEl){
  const ok=()=>toast(msg);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok).catch(()=>manual());else manual();
  function manual(){if(fallbackEl){fallbackEl.focus();fallbackEl.select();toast('Mantén pulsado para copiar')}else{S.keepModal=false;modal(`${mh('Copia el texto')}<textarea rows="12" readonly>${esc(t)}</textarea><p class="small muted" style="margin-top:8px">Mantén pulsado → Seleccionar todo → Copiar</p>`,md=>{const ta=md.querySelector('textarea');ta.focus();ta.select()})}}
}

/* ============ RACHAS, LOGROS, QUÍMICA ============ */
function enrich(st){
  for(const id in st){const s=st[id];
    let w=0,l=0,gs=0,dry=0,maxW=0,cw=0,maxG=0;
    s.hist.forEach(h=>{if(h.res==='V'){cw++;maxW=Math.max(maxW,cw)}else cw=0;maxG=Math.max(maxG,h.g)});
    for(let i=s.hist.length-1;i>=0;i--){if(s.hist[i].res==='V')w++;else break}
    for(let i=s.hist.length-1;i>=0;i--){if(s.hist[i].res==='D')l++;else break}
    for(let i=s.hist.length-1;i>=0;i--){if(s.hist[i].g>0)gs++;else break}
    for(let i=s.hist.length-1;i>=0;i--){if(!s.hist[i].g)dry++;else break}
    Object.assign(s,{wS:w,lS:l,gS:gs,dry,maxW,maxG});
  }
  return st;
}
function streak(s){
  if(s.wS>=2)return{e:'🔥',n:s.wS,t:`${s.wS} victorias seguidas`};
  if(s.gS>=3)return{e:'⚽',n:s.gS,t:`marcando ${s.gS} partidos seguidos`};
  if(s.lS>=3)return{e:'🥶',n:s.lS,t:`${s.lS} derrotas seguidas`};
  if(s.dry>=4)return{e:'🧊',n:s.dry,t:`${s.dry} partidos sin marcar`};
  return null;
}

function chemistry(pid){
  const tg={},vs={};
  Object.values(S.matches).filter(m=>m.status==='played'&&(m.teamA||[]).length).forEach(m=>{
    const res=resultFor(m,pid);if(!res)return;const mineA=m.teamA.includes(pid);
    const mates=(mineA?m.teamA:m.teamB).filter(x=>x!==pid&&P(x)),rivals=(mineA?m.teamB:m.teamA).filter(P);
    const w=res==='V'?1:0;
    mates.forEach(q=>{const o=tg[q]=tg[q]||{pj:0,w:0};o.pj++;o.w+=w});
    rivals.forEach(q=>{const o=vs[q]=vs[q]||{pj:0,w:0,l:0};o.pj++;o.w+=w;o.l+=res==='D'?1:0});
  });
  const pick=(o,f,ok,not)=>Object.entries(o).filter(([k,v])=>v.pj>=2&&ok(v)&&k!==not).sort((a,b)=>f(b[1])-f(a[1])||b[1].pj-a[1].pj)[0];
  const best=pick(tg,v=>v.w/v.pj,v=>v.w/v.pj>=.5);
  const nemesis=pick(vs,v=>v.l/v.pj,v=>v.l>0&&v.l/v.pj>=.5);
  return{best,worst:pick(tg,v=>-(v.w/v.pj),v=>v.w/v.pj<.5,best?.[0]),
    nemesis,victim:pick(vs,v=>v.w/v.pj,v=>v.w>0&&v.w/v.pj>=.5,nemesis?.[0])};
}
function informSet(){
  const recent=Object.values(S.matches).filter(m=>m.status==='played'&&(Date.now()-mdt(m))<7*864e5).sort((a,b)=>mdt(b)-mdt(a));
  for(const m of recent){const w=matchAwards(m).win.crack;if(w.length)return new Set(w)}
  return new Set();
}

/* ============ CRÓNICA ============ */
function hashStr(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function rng(seed){let x=seed||7;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return((x>>>0)%100000)/100000}}
function chronicle(m){
  const R=rng(hashStr(m.id+(m.scoreA||0)+'-'+(m.scoreB||0)));const pick=a=>a[Math.floor(R()*a.length)];
  const a=+m.scoreA||0,b=+m.scoreB||0,diff=Math.abs(a-b),W=Math.max(a,b),L=Math.min(a,b);
  const win=a>b?'Blancos':b>a?'Negros':null,lose=a>b?'Negros':'Blancos';
  const winT=a>b?m.teamA||[]:m.teamB||[],loseT=a>b?m.teamB||[]:m.teamA||[];
  const venue=m.venue||'el campo';const n=attendees(m).length;
  const sc=Object.entries(m.goals||{}).filter(([p,g])=>g>0&&P(p)).sort((x,y)=>y[1]-x[1]);
  const top=sc[0];const aw=matchAwards(m);const nm=p=>pname(p);
  const lv=computeLevels();const avg=t=>t.length?t.reduce((s,p)=>s+(lv[p]?.pre[m.id]??lv[p]?.level??2),0)/t.length:0;
  const upset=win&&avg(winT)<avg(loseT)-0.15;
  const nGol={2:'doblete',3:'hat-trick',4:'póker',5:'manita'};
  let title;
  if(top&&top[1]>=3&&R()<.6)title=pick([`${nm(top[0])} hace un ${nGol[Math.min(top[1],5)]} y ${win?`los ${winT.includes(top[0])?win:lose} ${winT.includes(top[0])?'ganan':'pierden igual'}`:'aun así empatan'}`,`Noche de ${nm(top[0])}: ${top[1]} goles en ${venue}`]);
  else if(!win)title=a===0?pick(['0-0: el mal fútbol en estado puro','Ni un gol. Ni uno. Leyendas.']):pick([`Tablas en ${venue}: ${a}-${b} y todos contentos`,`Empate a ${a} y nadie se fue a casa feliz`,`${a}-${b}: reparto de puntos y de vergüenza`]);
  else if(upset)title=pick([`Batacazo: los ${win} tumban a los favoritos (${W}-${L})`,`Sorpresa en ${venue}: los ${win} ganan ${W}-${L} contra pronóstico`]);
  else if(diff>=5)title=pick([`Paliza histórica: los ${win} pasan por encima (${W}-${L})`,`Los ${win} firman un ${W}-${L} que dolerá semanas`]);
  else if(diff>=3)title=pick([`Los ${win} golean a los ${lose} (${W}-${L})`,`Los ${win} no tienen piedad: ${W}-${L}`,`Exhibición de los ${win}: ${W}-${L}`]);
  else if(diff===1)title=pick([`Los ${win} se llevan un partido de infarto (${W}-${L})`,`Por la mínima: ${win} ${W}, ${lose} ${L}`,`Sufriendo pero ganando: los ${win}, ${W}-${L}`]);
  else title=pick([`Los ${win} se imponen ${W}-${L}`,`Victoria clara de los ${win} (${W}-${L})`]);
  const body=[];
  body.push(pick([`${DIA[mdt(m).getDay()][0].toUpperCase()+DIA[mdt(m).getDay()].slice(1)} de pachanga en ${venue}: ${n} valientes y ${a+b} ${a+b===1?'gol':'goles'}.`,`${n} jugadores se citaron en ${venue} para demostrar, otra vez, que el fútbol no es lo suyo.`,`Se jugó en ${venue}, ${n} en el campo y ${a+b} ${a+b===1?'gol':'goles'} en el marcador.`]));
  if(top){
    const g=top[1],p=nm(top[0]);
    if(g>=3)body.push(pick([`${p} se vistió de estrella con ${g} goles. Que no se acostumbre.`,`El ${nGol[Math.min(g,5)]} de ${p} será recordado... al menos hasta el jueves.`]));
    else if(g===2)body.push(pick([`${p} hizo un doblete y ya pide la renovación.`,`Doblete de ${p}, que celebró cada gol como una final.`]));
    else body.push(pick([`Goles repartidos: nadie quiso destacar demasiado.`,`El gol estuvo muy repartido, como la falta de calidad.`]));
    const others=sc.slice(1,4).map(([q,gg])=>`${nm(q)}${gg>1?` (${gg})`:''}`);
    if(others.length)body.push(`También marcaron ${others.join(', ')}.`);
  }else if(a+b===0)body.push(pick(['Los porteros fueron los mejores, o los delanteros los peores. El debate sigue abierto.','90 minutos de fútbol sin goles: un homenaje al nombre del grupo.']));
  if(upset)body.push(pick([`Sobre el papel no tenían nada que hacer, pero el papel no juega.`,`Los números decían otra cosa. Los números no saben de pachangas.`]));
  if(aw.nVotes){
    const j=k=>{const a=aw.win[k].map(nm);return a.length>1?a.slice(0,-1).join(', ')+' y '+a[a.length-1]:a[0]};const pl=(k,s,p)=>aw.win[k].length>1?p:s;
    if(aw.win.crack.length)body.push(pick([`El vestuario eligió a ${j('crack')} como El Crack ⭐.`,`⭐ ${j('crack')}, El Crack de la noche por votación popular.`]));
    if(aw.win.dandy.length)body.push(pick([`🎩 ${j('dandy')} ${pl('dandy','se llevó','se llevaron')} el premio Dandy: más filigranas que acierto.`,`El toque de distinción ${pl('dandy','lo puso','lo pusieron')} ${j('dandy')} 🎩.`]));
    if(aw.win.duro.length)body.push(pick([`🪨 ${j('duro')} ${pl('duro','repartió','repartieron')} más que el cartero.`,`Pierna fuerte y cero miedo: ${j('duro')} 🪨.`]));

function wrap(g,text,x,y,maxW,lh,maxLines=4){

// Rombo de fútbol sala: pívot arriba, dos alas, cierre y portero. Devuelve [id, x%, y%, etiqueta].
function rombo(lines){
  const[del,med,def,por]=lines;const out=[];
  if(del[0])out.push([del[0],50,0,'Pívot']);
  if(med[0])out.push([med[0],med[1]?18:50,24,'Ala']);
  if(med[1])out.push([med[1],82,24,'Ala']);
  if(def[0])out.push([def[0],50,46,'Cierre']);
  if(por[0])out.push([por[0],50,71,'Portero']);
  return out;
}
function totmLines(stM,st){
  const ranked=Object.keys(stM).filter(id=>stM[id].pj>0).sort((a,b)=>stM[b].pts-stM[a].pts||st[b].level-st[a].level);
  const slots=[['DEL',1],['MED',2],['DEF',1],['POR',1]];const used=new Set();const lines=slots.map(()=>[]);
  slots.forEach(([pos,n],i)=>{for(const id of ranked){if(lines[i].length>=n)break;if(!used.has(id)&&P(id)?.pos===pos){lines[i].push(id);used.add(id)}}});
  const rest=ranked.filter(id=>!used.has(id));
  slots.forEach(([,n],i)=>{while(lines[i].length<n&&rest.length){const id=rest.shift();lines[i].push(id);used.add(id)}});
  return lines;
}

/* ============ PREVIA ============ */
function countdownTxt(m){
  const h=hoursTo(m);if(h<=0)return'¡En juego o recién acabado!';
  const d=Math.floor(h/24),hh=Math.floor(h%24),mm=Math.floor((h*60)%60);
  if(h<12&&mdt(m).getDate()===new Date().getDate())return`¡Hoy a las ${m.time}! Faltan ${hh}h ${mm}min`;
  return d?`Faltan ${d} ${d===1?'día':'días'} y ${hh}h`:`Faltan ${hh}h ${mm}min`;
}
function previewHtml(m,T,st){
  if(!T||T.A.length<2||T.B.length<2)return'';
  const lv=p=>st[p]?.level||2;const avg=t=>t.reduce((s,p)=>s+lv(p),0)/t.length;
  const la=avg(T.A),lb=avg(T.B);const eA=1/(1+Math.pow(10,(lb-la)/LV.SCALE));const pa=Math.round(eA*100);
  const star=t=>t.slice().sort((a,b)=>lv(b)-lv(a))[0];
  const hot=t=>t.map(p=>[p,streak(st[p])]).filter(([,s])=>s&&(s.e==='🔥'||s.e==='⚽'));
  const cold=t=>t.map(p=>[p,streak(st[p])]).filter(([,s])=>s&&(s.e==='🥶'||s.e==='🧊'));
  const col=(k,t)=>{const s=star(t),h=hot(t),c=cold(t);return`<div class="pv-col ${TEAM[k].c}">
    <div class="pv-t">${TEAM[k].n}</div><div class="pv-lv">⚡${avg(t).toFixed(2)}</div>
    <div class="pv-k">A seguir</div><div class="pv-p">${face(s)} ${esc(pname(s))}</div>
    ${h.length?`<div class="pv-k">En racha</div>${h.slice(0,2).map(([p,s])=>`<div class="pv-p">${s.e}${s.n} ${esc(pname(p))}</div>`).join('')}`:''}
    ${c.length?`<div class="pv-k">En crisis</div>${c.slice(0,1).map(([p,s])=>`<div class="pv-p">${s.e}${s.n} ${esc(pname(p))}</div>`).join('')}`:''}</div>`};
  const fav=Math.abs(pa-50)<5?'Partido igualadísimo':pa>50?`Favoritos: Blancos`:`Favoritos: Negros`;
  return`<div class="previa"><div class="pv-h"><span>📺 La previa</span><span class="pv-cd">${esc(countdownTxt(m))}</span></div>
    <div class="pv-odds"><div class="pv-bar"><i style="width:${pa}%"></i></div><div class="row small" style="justify-content:space-between;margin-top:6px"><b>Blancos ${pa}%</b><span class="muted">${fav}</span><b>${100-pa}% Negros</b></div></div>
    <div class="pv-grid">${col('A',T.A)}${col('B',T.B)}</div>${wxHtml(m)}</div>`;
}

function wrappedData(pid,y){
  const stS=computeStats(m=>seasonOf(m)===y);const s=stS[pid];if(!s||!s.pj)return null;
  const LVL=computeLevels();const ms=s.hist.map(h=>h.m.id);
  const startLv=ms.length?(LVL[pid].pre[ms[0]]??s.lv0):s.lv0;const endLv=LVL[pid].level;
  const bestM=s.hist.slice().sort((a,b)=>b.pts-a.pts)[0];const goalM=s.hist.slice().sort((a,b)=>b.g-a.g)[0];
  const rank=Object.keys(stS).filter(i=>stS[i].pj>0).sort((a,b)=>stS[b].pts-stS[a].pts);
  const gr=Object.keys(stS).filter(i=>stS[i].pj>0).sort((a,b)=>stS[b].g-stS[a].g);
  return{s,startLv,endLv,bestM,goalM,pos:rank.indexOf(pid)+1,of:rank.length,gpos:gr.indexOf(pid)+1,chem:chemistry(pid),ach:achList().filter(a=>a.t(enrich(computeStats())[pid]))};
}

function kitOrders(){return Object.values(S.players).filter(p=>p.kit).sort((a,b)=>(a.kit.at||0)-(b.kit.at||0))}

    md.querySelectorAll('#kb .opt').forEach(b=>b.onclick=()=>{both=b.dataset.v==='both';if(!both)only=b.dataset.v;md.querySelectorAll('#kb .opt').forEach(x=>x.classList.toggle('on',x===b));prev()});
    md.querySelector('#sv').onclick=async e=>{
      const d=+md.querySelector('#kd').value;const name=md.querySelector('#kn').value.trim()||p.name;
      if(!d||d<1||d>99){toast('Elige un dorsal del 1 al 99');return}
      if(taken.has(d)){toast(`El ${d} ya lo tiene otro`);return}
      e.target.disabled=true;
      try{await store.doc('players/'+me).update({dorsal:d,kit:{size,name,both,only:both?null:only,at:k.at||Date.now()}});close();toast('¡Apuntado al pedido! 👕')}catch(x){e.target.disabled=false;err(x)}
    };
    const rm=md.querySelector('#rm');if(rm)rm.onclick=async()=>{try{await store.doc('players/'+me).update({kit:null});close();toast('Quitado del pedido')}catch(x){err(x)}};

}

/* ============ DATOS ============ */
async function firebaseStore(cfg){
  const V='10.12.2';
  const app=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const fdb=fs.initializeFirestore(app.initializeApp(cfg),{ignoreUndefinedProperties:true});
  return{mode:'live',
    doc:p=>{const r=fs.doc(fdb,p);return{set:d=>fs.setDoc(r,d),update:d=>fs.updateDoc(r,d),delete:()=>fs.deleteDoc(r)}},
    collection:c=>({onSnapshot:(cb,er)=>fs.onSnapshot(fs.collection(fdb,c),s=>cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),fromCache:s.metadata.fromCache}),er)})};
}
function demoStore(){
  let data=null;try{data=JSON.parse(localStorage.getItem('fifa07_demo'))}catch(e){}
  if(!data){data=seed();me='d0';try{localStorage.setItem('fifa07_me','d0')}catch(e){}}
  const subs={};const save=()=>{try{localStorage.setItem('fifa07_demo',JSON.stringify(data))}catch(e){}};
  const snap=c=>({docs:Object.entries(data[c]||{}).map(([id,d])=>({id,data:()=>JSON.parse(JSON.stringify(d))})),fromCache:false});
  const emit=c=>(subs[c]||[]).forEach(cb=>cb(snap(c)));
  const split=p=>{const i=p.indexOf('/');return[p.slice(0,i),p.slice(i+1)]};
  const clean=d=>JSON.parse(JSON.stringify(d));
  save();
  return{mode:'demo',
    doc:p=>{const[c,id]=split(p);return{
      set:async d=>{(data[c]=data[c]||{})[id]=clean(d);save();emit(c)},
      update:async d=>{if(!data[c]?.[id])throw new Error('no existe');Object.assign(data[c][id],clean(d));save();emit(c)},
      delete:async()=>{if(data[c])delete data[c][id];save();emit(c)}}},
    collection:c=>({onSnapshot:cb=>{(subs[c]=subs[c]||[]).push(cb);setTimeout(()=>cb(snap(c)),0);return()=>{}}}),
    reset:()=>{data=seed();save();Object.keys(subs).forEach(emit)}};
}
function seed(){
  const names=[['Dani','MED','😎',3],['El Pirata','DEL','🥸',3],['Juanma','DEF','🧔',2],['Rafita','POR','🦍',2],['Curro','MED','🐂',3],['Lolo','DEF','🐢',1],['Chino','DEL','🔥',4],['Fran','TODO','🍺',2],['Kike','DEF','🧱',2],['Tito','MED','🐐',3],['Manu','POR','🦥',1],['Javi','DEL','🤠',3],['Nono','TODO','🐷',2],['Moi','MED','🦁',4]];
  const players={};names.forEach(([n,pos,e,l],i)=>players['d'+i]={name:n,pos,emoji:e,level0:l,yellow:i===5?1:0,red:0,cardLog:[],admin:i===0,createdAt:i});
  [[1,9,'M'],[2,4,'XL'],[3,1,'L'],[4,8,'L'],[6,10,'S'],[9,6,'M'],[13,23,'L']].forEach(([i,d,sz])=>{players['d'+i].dorsal=d;players['d'+i].kit={size:sz,name:players['d'+i].name,both:true,at:i}});
  const matches={},signups={},votes={},voted={};
  let rnd=7;const R=()=>{rnd=(rnd*9301+49297)%233280;return rnd/233280};
  const dAgo=k=>{const d=new Date();d.setDate(d.getDate()-k);return ymd(d)};
  const ids=Object.keys(players);
  [[18,'Altillo','Fut7',14],[11,'Indoor Jerez','Fut5',10],[4,'Altillo','Fut7',14]].forEach(([ago,venue,format,slots],mi)=>{
    const pool=ids.slice().sort(()=>R()-.5).slice(0,slots);
    const half=Math.ceil(pool.length/2);const A=pool.slice(0,half),B=pool.slice(half);
    const goals={},assists={};let sa=0,sb=0;
    pool.forEach(p=>{const g=Math.floor(R()*R()*4*(players[p].level0/2.5));goals[p]=g;assists[p]=Math.floor(R()*2);if(A.includes(p))sa+=g;else sb+=g});
    const mid='dm'+mi;
    matches[mid]={date:dAgo(ago),time:'21:00',venue,format,slots,price:format==='Fut7'?'4':'5',bizum:'600 123 456',notes:'',status:'played',teamA:A,teamB:B,scoreA:sa,scoreB:sb,goals,assists,paid:Object.fromEntries(pool.filter(()=>R()>.25).map(p=>[p,true])),kit:Object.fromEntries(pool.filter(p=>players[p].kit&&R()>.3).map(p=>[p,true])),createdBy:'d0',createdAt:mi};
    pool.forEach((p,i)=>signups[`${mid}__${p}`]={mid,pid:p,at:i});
    pool.forEach(v=>{if(v==='d0'&&mi===2)return;if(R()<.2)return;
      const ratings={};pool.forEach(p=>{if(p!==v)ratings[p]=Math.max(1,Math.min(5,Math.round(players[p].level0+(R()-.5)*2+(goals[p]>1?1:0))))});
      const others=pool.filter(p=>p!==v);const best=others.slice().sort((a,b)=>ratings[b]-ratings[a]);
      votes['dv'+mi+v]={mid,ratings,awards:{crack:best[Math.floor(R()*2)],dandy:best[2+Math.floor(R()*3)],duro:best[Math.floor(R()*others.length)],vaya:best[best.length-1-Math.floor(R()*2)]}};
      voted[`${mid}__${v}`]={mid,pid:v};
    });
  });
  const fut=k=>{const d=new Date();d.setDate(d.getDate()+k);return ymd(d)};
  matches.dn1={date:fut(3),time:'21:30',venue:'Altillo',format:'Fut7',slots:14,price:'4',bizum:'600 123 456',notes:'Traed camiseta blanca y negra',status:'open',teamA:[],teamB:[],scoreA:0,scoreB:0,goals:{},assists:{},paid:{},createdBy:'d0',createdAt:10};
  ids.slice(1,11).forEach((p,i)=>signups[`dn1__${p}`]={mid:'dn1',pid:p,at:100+i});
  matches.dn2={date:fut(9),time:'20:00',venue:'Fun Center',format:'Fut5',slots:10,price:'5',bizum:'',notes:'',status:'open',teamA:[],teamB:[],scoreA:0,scoreB:0,goals:{},assists:{},paid:{},createdBy:'d4',createdAt:11};
  ['d4','d6','d9'].forEach((p,i)=>signups[`dn2__${p}`]={mid:'dn2',pid:p,at:200+i});
  const pd=k=>{const d=new Date();d.setDate(d.getDate()+k);return ymd(d)};
  const polls={dp1:{title:'¿Qué día os viene la semana que viene?',options:[{date:pd(6),time:'21:00'},{date:pd(7),time:'21:30'},{date:pd(8),time:'20:00'}],venue:'Altillo',format:'Fut7',createdBy:'d0',createdAt:1,closed:false}};
  const pollVotes={};['d1','d2','d3','d4','d6','d7','d9','d13'].forEach((p,i)=>pollVotes['dp1__'+p]={poll:'dp1',pid:p,picks:i%3===0?[0,1]:i%3===1?[1]:[1,2]});
  return{players,matches,signups,votes,voted,polls,pollVotes};
}
function sub(col){
  const t=setTimeout(()=>{if(!S.ready[col]){S.ready[col]=1;render();toast('La conexión va lenta…')}},10000);
  store.collection(col).onSnapshot(snap=>{
    clearTimeout(t);const o={};snap.docs.forEach(d=>o[d.id]={id:d.id,...d.data()});
    S[col]=o;S.ready[col]=1;
    if(col==='players'&&me&&!o[me]&&snap.docs.length)me=null;
    renderMe();render();
  },e=>{clearTimeout(t);console.error(e);S.ready[col]=1;if(col==='players')storeErr=true;render()});
}
(async()=>{
  $('#logo').innerHTML=`${esc(APP_NAME[0])}<b>${esc(APP_NAME[1])}</b>${BETA?'<span class="beta">BETA</span>':''}<small>${esc(SLOGAN)}</small>`;document.title=APP_NAME.join('')+' · Pachangas';
  try{store=FIREBASE_CONFIG?await firebaseStore(FIREBASE_CONFIG):demoStore()}
  catch(e){console.error(e);storeErr=true;render();return}
  ['players','matches','signups','votes','voted','galaVotes','galaVoted','config','polls','pollVotes','feedback'].forEach(sub);
  setInterval(()=>{if(!S.sheet&&!document.querySelector('.md'))render()},60000);
})();
